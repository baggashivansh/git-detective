spring:
  application:
    name: git-detective
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gitdetective}
    username: ${DATABASE_USERNAME:gitdetective}
    password: ${DATABASE_PASSWORD:gitdetective}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

gitdetective:
  application:
    version: ${APP_VERSION:1.0.0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  analysis:
    workspace-root: ${WORKSPACE_ROOT:${java.io.tmpdir}/git-detective-workspaces}
    clone-timeout-seconds: ${CLONE_TIMEOUT_SECONDS:300}
    max-repository-size-bytes: ${MAX_REPOSITORY_SIZE_BYTES:524288000}
    max-files: ${MAX_FILES:50000}
    max-commits: ${MAX_COMMITS:10000}
  ai:
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    temperature: ${AI_TEMPERATURE:0.2}
    max-tokens: ${AI_MAX_TOKENS:2048}
    stub-mode: ${AI_STUB_MODE:true}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}
  security:
    rate-limit:
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    root: INFO
    com.gitdetective: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n"
