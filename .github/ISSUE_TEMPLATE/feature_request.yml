name: Feature request
description: Propose a capability for a future approved phase
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature work must remain within the currently approved phase unless explicitly scheduled.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Target phase
      options:
        - Phase 1 — Foundation
        - Later phase (unspecified)
        - Unknown / needs triage
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicit non-goals
      description: What should not be included?
