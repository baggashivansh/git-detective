zerops:
  - setup: backend
    build:
      base: java@21
      buildCommands:
        - cd backend && mvn -q -DskipTests package
      deployFiles:
        - backend/target/git-detective-backend.jar
      cache:
        - backend/.m2
    deploy:
      readinessCheck:
        httpGet:
          port: 8080
          path: /health
    run:
      base: java@21
      ports:
        - port: 8080
          httpSupport: true
      start: java -jar backend/target/git-detective-backend.jar
      envVariables:
        SERVER_PORT: "8080"
        APP_VERSION: "1.0.0"
        SPRING_PROFILES_ACTIVE: prod

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        # NEXT_PUBLIC_* must be present at build time (runtime env alone is not enough)
        - |
          cd frontend
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://backend-2a87-8080.prg1.zerops.app}"
          echo "Building with NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL"
          npm ci
          npm run build
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
      deployFiles:
        - frontend/.next/standalone
      cache:
        - frontend/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node frontend/.next/standalone/server.js
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        NEXT_PUBLIC_API_BASE_URL: https://backend-2a87-8080.prg1.zerops.app
