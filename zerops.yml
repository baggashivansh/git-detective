zerops:
  - setup: backend
    build:
      base: java@21
      buildCommands:
        - cd backend && mvn -q -DskipTests package
      deployFiles:
        - backend/target/git-detective-backend.jar
      cache:
        - backend/.m2
    deploy:
      readinessCheck:
        httpGet:
          port: 8080
          path: /health
    run:
      base: java@21
      ports:
        - port: 8080
          httpSupport: true
      start: java -jar backend/target/git-detective-backend.jar
      envVariables:
        SERVER_PORT: "8080"
        APP_VERSION: "1.0.0"
        SPRING_PROFILES_ACTIVE: prod

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm ci && npm run build
        # Next standalone expects static + public inside the standalone folder
        - mkdir -p frontend/.next/standalone/.next
        - cp -R frontend/.next/static frontend/.next/standalone/.next/static
        - cp -R frontend/public frontend/.next/standalone/public
      deployFiles:
        - frontend/.next/standalone
      cache:
        - frontend/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node frontend/.next/standalone/server.js
      envVariables:
        NODE_ENV: production
        PORT: "3000"
